<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查看解手流独享数随时间的变化。">
  <title>独享数历史 · 解手独享速查</title>
  <link rel="icon" type="image/png" sizes="285x345" href="./site-icon.png?v=da292383">
  <link rel="stylesheet" href="./style.css?v=recent-axis-skin-colors">
  <script defer src="./snapshot.js"></script>
  <script defer src="./trend-portraits.js?v=client-skin-colors"></script>
  <script defer src="./replay-history.js?v=daily-20261118"></script>
  <script defer src="./replay-data.js?v=rank-controls"></script>
  <script defer src="./trends.js?v=recent-axis-skin-colors"></script>
  <script defer src="./replay-events.js?v=event-banners"></script>
  <script defer src="./replay-rank.js?v=rank-scale-50"></script>
</head>
<body>
  <header class="header">
    <div class="shell header-inner">
      <div class="brand"><img class="brand-mark" src="./site-icon.png?v=da292383" width="30" height="30" alt=""><span>解手独享速查</span></div>
      <a href="./index.html">← 返回查询</a>
    </div>
  </header>
  <main class="shell main trend-shell">
    <div class="intro">
      <div>
        <h1>独享数历史</h1>
        <p>数据来自<a href="https://wiki.arkrec.com/exclusive-records">少人 Wiki 的独享纪录</a> · 解手流</p>
      </div>
    </div>
    <section class="trend-panel" id="trend-panel" aria-label="独享数折线图" hidden>
      <div class="trend-filters">
        <div>
          <label for="trend-scope" class="field-label">类别</label>
          <select id="trend-scope">
            <option value="all">全部</option>
            <option value="activity">活动</option>
            <option value="main">主线</option>
          </select>
        </div>
        <div id="trend-recent-granularity">
          <label for="trend-granularity" class="field-label">时间粒度</label>
          <select id="trend-granularity">
            <option value="day">每天</option>
            <option value="sample">更新快照</option>
          </select>
        </div>
        <details class="trend-picker" id="trend-picker">
          <summary id="trend-picker-summary">干员</summary>
          <div class="trend-picker-content">
            <label for="trend-search" class="field-label">搜索干员</label>
            <input id="trend-search" type="search" placeholder="输入干员名">
            <div class="trend-picker-actions">
              <button id="trend-top" type="button">选择前 20 名</button>
              <button id="trend-all-exclusive" type="button">选择有独享的干员</button>
              <button id="trend-clear" type="button">清空选择</button>
            </div>
            <div id="trend-choices" class="trend-choices" role="group" aria-label="选择干员"></div>
            <p class="empty" id="trend-search-empty" hidden>没有匹配的干员。</p>
          </div>
        </details>
      </div>
      <div class="trend-options">
        <label class="trend-choice"><input type="checkbox" id="trend-include-closed">显示已关闭活动</label>
        <label id="trend-replay-option" class="trend-choice" hidden><input type="checkbox" id="trend-replay">查看历史估算</label>
        <p class="trend-caption" id="trend-caption"></p>
        <button class="trend-show-changes" id="trend-show-changes" type="button" hidden>只选有变化的干员</button>
      </div>
      <p class="trend-caption trend-replay-note" id="trend-replay-note" hidden></p>
      <div class="trend-chart" id="trend-recent-chart">
        <div class="trend-chart-heading">
          <output id="trend-readout" aria-live="polite"></output>
          <div id="trend-zoom-tools" class="trend-zoom-tools" role="group" aria-label="图表缩放">
            <button type="button" id="trend-box-zoom" aria-pressed="false" aria-controls="trend-canvas">框选放大</button>
            <button type="button" id="trend-zoom-in" aria-label="放大纵轴" title="放大纵轴">＋</button>
            <button type="button" id="trend-zoom-out" aria-label="缩小纵轴" title="缩小纵轴">−</button>
            <button type="button" id="trend-zoom-reset">恢复全图</button>
          </div>
        </div>
        <p id="trend-zoom-hint" class="trend-zoom-hint" role="status" hidden></p>
        <p class="empty" id="trend-no-selection" hidden>选择干员后可查看趋势。</p>
        <p id="trend-scale-label" class="trend-zoom-hint" hidden></p>
        <div class="trend-backfill" id="trend-backfill" hidden>
          <label>跳到日期 <input id="trend-jump-date" type="date"></label>
          <span id="trend-backfill-note"></span>
        </div>
        <p class="trend-zoom-hint">右侧头像对应可见曲线的右端，点击查看当前独享</p>
        <div class="trend-plot">
          <canvas id="trend-canvas" role="img" tabindex="0" aria-label="解手流独享趋势，按左右方向键选择日期，头像旁显示可见曲线右端的独享数"></canvas>
          <div id="trend-line-tooltip" class="trend-line-tooltip" role="tooltip" hidden>
            <strong></strong><span></span>
          </div>
        </div>
        <ul id="trend-legend" class="trend-legend" aria-label="所选日期的干员独享数"></ul>
      </div>
      <section id="trend-race" class="trend-race" aria-label="独享数动态排行" hidden>
        <div class="trend-race-heading">
          <div><h2>独享数排行</h2><p id="race-source" class="trend-caption"></p></div>
          <time id="race-date"></time>
          <label class="trend-race-limit">前 <input id="race-limit" type="number" min="1" step="1" value="20" aria-label="前几名"> 名</label>
        </div>
        <div class="trend-replay-navigation" role="group" aria-label="历史估算日期">
          <button id="race-previous" type="button">前一天</button>
          <input id="race-day" type="date" aria-label="查看日期">
          <button id="race-next" type="button">后一天</button>
        </div>
        <div class="trend-replay-navigation" role="group" aria-label="历史区间播放">
          <label>起始 <input id="race-start" type="date" aria-label="起始日期"></label>
          <label>结束 <input id="race-end" type="date" aria-label="结束日期"></label>
          <button id="race-play" type="button">播放区间</button>
          <button id="race-reset" type="button">重置</button>
          <label class="trend-race-speed">速度 <input id="race-speed" type="range" min="1" max="10" value="3" step="1" aria-label="播放速度">
            <output id="race-speed-value" for="race-speed">3 次变化/秒</output></label>
        </div>
        <div class="trend-event-panel">
          <p id="race-event-current" class="trend-caption">首开作战活动时间轴</p>
          <div class="trend-event-frame">
            <div id="race-event-scroll" class="trend-event-scroll" role="region" aria-label="首开作战活动时间轴" tabindex="0">
              <div id="race-event-track" class="trend-event-track">
                <div id="race-event-line" class="trend-event-line" role="slider" aria-label="历史播放日期" tabindex="0">
                  <div id="race-event-progress" class="trend-event-progress"></div>
                </div>
              </div>
            </div>
            <span id="race-event-cursor" class="trend-event-cursor" aria-hidden="true" hidden></span>
          </div>
        </div>
        <div class="trend-race-scale" id="race-scale" aria-label="独享数刻度"></div>
        <div class="trend-race-rows" id="race-rows"></div>
        <p class="empty" id="race-empty" hidden>这一天在当前范围内没有独享。</p>
      </section>
    </section>
    <p class="empty" id="trend-empty">暂无少人 Wiki 独享快照。</p>
    <dialog id="trend-detail" class="trend-detail" aria-labelledby="trend-detail-title">
      <div class="trend-detail-heading">
        <h2 id="trend-detail-title"></h2>
        <form method="dialog"><button type="submit">关闭</button></form>
      </div>
      <p id="trend-detail-count"></p>
      <ul id="trend-detail-list"></ul>
    </dialog>
    <noscript><p class="empty">请启用 JavaScript 查看趋势。</p></noscript>
  </main>
</body>
</html>
