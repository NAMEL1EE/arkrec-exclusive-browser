<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按活动和主线章节查看明日方舟少人 Wiki 的解手流独享纪录。">
  <title>解手独享速查</title>
  <link rel="icon" type="image/png" sizes="285x345" href="./site-icon.png?v=da292383">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./snapshot.js"></script>
  <script defer src="./app.js"></script>
  <script defer src="./site-config.js"></script>
  <script defer src="./refresh.js?v=status-retry"></script>
</head>
<body>
  <header class="header">
    <div class="shell header-inner">
      <div class="brand"><img class="brand-mark" src="./site-icon.png?v=da292383" width="30" height="30" alt=""><span>解手独享速查</span></div>
      <nav class="header-links" aria-label="站点导航">
        <a href="./trends.html">独享数历史</a>
        <a href="https://wiki.arkrec.com/exclusive-records" target="_blank" rel="noopener">少人 Wiki ↗</a>
      </nav>
    </div>
  </header>
  <main class="shell main">
    <div class="intro">
      <div>
        <h1>解手独享速查</h1>
        <p>按活动或主线章节查看所有独享关卡和干员。</p>
      </div>
      <div class="refresh-controls">
        <div class="refresh-row">
          <p class="snapshot" id="snapshot"></p>
          <button class="refresh-button" id="refresh-button" type="button" disabled aria-describedby="refresh-status">更新数据</button>
        </div>
        <p class="refresh-status" id="refresh-status" role="status">正在检查更新服务…</p>
        <a class="refresh-run" id="refresh-run" target="_blank" rel="noopener" hidden>查看更新进度 ↗</a>
      </div>
    </div>
    <div class="layout" id="layout" hidden>
      <section class="picker" aria-label="选择活动或主线章节">
        <button class="picker-toggle" id="picker-toggle" type="button" aria-controls="picker-body" aria-expanded="false">
          <span id="picker-current">选择活动</span><span class="picker-action" id="picker-action">切换 ▾</span>
        </button>
        <div id="picker-body">
          <div class="picker-nav">
            <div class="tabs" role="group" aria-label="选择分类">
              <button type="button" data-story="活动关卡" aria-pressed="true">活动</button>
              <button type="button" data-story="主线关卡" aria-pressed="false">主线</button>
            </div>
          </div>
          <div class="picker-content">
            <div class="picker-heading">
              <h2 id="picker-title">选择活动</h2>
              <input id="group-search" type="search" aria-label="筛选活动或关卡" autocomplete="off" placeholder="活动或关卡（跨年份）">
            </div>
            <div class="years" id="years" role="group" aria-label="选择活动年份"></div>
            <div class="groups" id="groups"></div>
          </div>
        </div>
      </section>
      <p class="selection-prompt" id="selection-prompt" role="status" hidden></p>
      <section class="results" id="results" aria-labelledby="group-title">
        <div class="result-head">
          <div class="result-identity">
            <div class="result-name">
              <p class="group-type" id="group-type"></p>
              <h2 id="group-title"></h2>
            </div>
            <button class="steps-toggle" id="steps-toggle" type="button" aria-expanded="false" aria-controls="group-steps" hidden>步数速查</button>
          </div>
          <div class="total"><strong id="total"></strong><span>独享关卡</span></div>
        </div>
        <div class="table-wrap overview-wrap" id="group-steps" role="region" aria-label="关卡步数速查" tabindex="0" hidden>
          <table>
            <thead><tr id="overview-head"></tr></thead>
            <tbody id="overview-body"></tbody>
          </table>
        </div>
        <div class="table-wrap" id="table-wrap">
          <table>
            <thead><tr><th scope="col">关卡</th><th scope="col" data-mode="normal">普通独享</th><th scope="col" data-mode="challenge">突袭独享</th><th scope="col" data-mode="sandbox" hidden>沙盘 2 级独享</th></tr></thead>
            <tbody id="records"></tbody>
          </table>
        </div>
        <p class="empty" id="empty" hidden>该活动或章节暂无解手流独享。</p>
      </section>
    </div>
    <p class="empty" id="error" hidden>无法读取独享快照。请检查网页文件是否完整。</p>
  </main>
  <noscript><p class="shell empty">请启用 JavaScript 查看独享快照。</p></noscript>
</body>
</html>
