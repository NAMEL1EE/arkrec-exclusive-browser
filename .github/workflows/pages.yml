name: 发布解手流独享查询

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: 从少人 Wiki 增量更新数据
        type: boolean
        default: true
      max_pages:
        description: 最新记录最多读取页数（每页间隔至少 1.5 秒）
        type: number
        default: 32

concurrency:
  group: arkrec-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 更新解手流快照
        if: github.event_name == 'workflow_dispatch' && inputs.refresh
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          node scripts/sync.mjs update --max-pages "$MAX_PAGES"
      - name: 同步活动预告
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          if ! node scripts/event-schedule.mjs; then
            echo "::warning::活动日程同步失败，继续使用上次保存的日程。"
          fi
      - name: 保存已更新的数据
        id: save
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/snapshot.js data/flow-records.json dist/event-schedule.js
          if ! git diff --cached --quiet; then
            git commit -m "更新解手流独享数据和活动日程"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 判断是否发布
        id: release
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        run: echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.release.outputs.publish == 'true'
      - name: 配置公开服务和快照版本
        if: steps.release.outputs.publish == 'true'
        env:
          NOTES_API_URL: ${{ vars.NOTES_API_URL }}
          REFRESH_API_URL: ${{ vars.REFRESH_API_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'
          function apiUrl(value, route) {
            if (!value) return null
            const api = new URL(value)
            if (api.protocol !== 'https:' || api.pathname !== route || api.username || api.password || api.search || api.hash) {
              throw new Error('服务地址必须是 HTTPS 的 ' + route + ' 路径')
            }
            return api.href
          }
          const config = {
            apiUrl: apiUrl(process.env.NOTES_API_URL, '/api/notes'),
            refreshUrl: apiUrl(process.env.REFRESH_API_URL, '/api/refresh'),
          }
          writeFileSync('dist/site-config.js', 'window.ARKREC_SITE_CONFIG = ' + JSON.stringify(config) + '\n')
          const version = file => createHash('sha256').update(readFileSync(file)).digest('hex').slice(0, 16)
          const hash = version('dist/snapshot.js')
          const scheduleHash = version('dist/event-schedule.js')
          for (const file of ['dist/index.html', 'dist/trends.html']) {
            const html = readFileSync(file, 'utf8')
              .replace('src="./snapshot.js"', 'src="./snapshot.js?v=' + hash + '"')
              .replace('src="./event-schedule.js"', 'src="./event-schedule.js?v=' + scheduleHash + '"')
              .replace('href="./index.html"', 'href="./index.html?v=' + hash + '"')
            writeFileSync(file, html)
          }
          NODE
      - uses: actions/upload-pages-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          path: dist
  deploy:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
